[server]
headless = true
# Keep in step with DERMA_MAX_UPLOAD_MB, which imaging.decode_image enforces.
maxUploadSize = 12

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Linen, ink and clay. Fonts come from Google Fonts and fall back to the
# system stacks when the browser is offline.
[theme]
base = "light"
primaryColor = "#94452b"
backgroundColor = "#f8f5f0"
secondaryBackgroundColor = "#efe9e1"
textColor = "#23201c"
borderColor = "#e2dad0"
linkColor = "#94452b"
baseRadius = "small"
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"

[theme.sidebar]
backgroundColor = "#f1ebe2"
